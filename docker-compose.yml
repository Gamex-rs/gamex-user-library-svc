services:
  user-library-svc:
    build: .
    ports:
      - "5002:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # Development: migrations on startup, OpenAPI at /openapi/v1.json, ephemeral JWT key if JWT_PRIVATE_KEY is unset
      # (its public key is logged at startup for the other services).
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_CONNECTION_STRING=Server=library-db;Database=library_db;User=root;Password=localdev;
      - AWS_DEFAULT_REGION=eu-central-1
      - AWS_SERVICE_URL=http://localstack:4566
      - SQS_LIBRARY_EVENTS_URL=http://localstack:4566/000000000000/gamex-library-events
      - SQS_ACTIVITY_EVENTS_URL=http://localstack:4566/000000000000/gamex-activity-events
      - SQS_CATALOG_EVENTS_URL=http://localstack:4566/000000000000/gamex-catalog-events
      - FRONTEND_BASE_URL=http://localhost:5173
      - PUBLIC_API_BASE_URL=http://localhost:5002
    depends_on:
      library-db:
        condition: service_healthy
      localstack:
        condition: service_healthy

  library-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: library_db
      MYSQL_ROOT_PASSWORD: localdev
    ports:
      - "3308:3306"
    volumes:
      - library-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocaldev"]
      interval: 5s
      retries: 20

  localstack:
    image: localstack/localstack:3
    ports:
      - "4567:4566"
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: eu-central-1
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "get-queue-url", "--queue-name", "gamex-catalog-events"]
      interval: 5s
      retries: 20

volumes:
  library-db-data:
